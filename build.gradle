plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }

        // Second client for two-player testing (separate game dir + username).
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // squadtp jar built by the sibling project; never modified from here.
    // Ivy artifact-only layout gives the jar real module metadata so MDG's
    // SRG->named remapping transform applies (flatDir/files() do not work).
    // squadtp's own build embeds the MC version/loader in its jar filename
    // (archivesName = "squadtp-${minecraft_version}-forge"), so the pattern
    // has to match that instead of a bare "[module]-[revision].[ext]".
    ivy {
        name = 'squadtpLocal'
        url = uri(file('../squadtp/build/libs'))
        patternLayout { artifact "[module]-${minecraft_version}-forge-[revision].[ext]" }
        metadataSources { artifact() }
        content { includeModule('uk.iwaservice', 'squadtp') }
    }
    // classloadout jar built by the sibling project (optional soft dependency, see
    // compat/ClassLoadoutCompat). Its archivesName has no MC-version/loader suffix
    // (unlike squadtp's), so the pattern is the bare default.
    ivy {
        name = 'classloadoutLocal'
        url = uri(file('../classloadout/build/libs'))
        patternLayout { artifact "[module]-[revision].[ext]" }
        metadataSources { artifact() }
        content { includeModule('uk.iwaservice', 'classloadout') }
    }
    // JourneyMap API (v1.x for MC 1.20.x)
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
    }
    // Full JourneyMap mod for in-dev runtime testing
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Reobfuscated (SRG) squadtp jar, remapped to named mappings for the dev
    // runtime by ModDevGradle. Loads as a real mod in runClient/runServer.
    modImplementation "uk.iwaservice:squadtp:${squadtp_version}"

    // JourneyMap: compile-time only soft dependency, never shipped or required (see compat/journeymap).
    compileOnly "info.journeymap:journeymap-api:${journeymap_api_version}"
    // JourneyMap 1.20.1-5.10.3-forge, remapped SRG->named for the dev runtime only.
    // Production jars must NOT go into run/mods: their mixins fail against named MC classes.
    modRuntimeOnly 'curse.maven:journeymap-32274:5789363'

    // classloadout: compile-time only soft dependency, never shipped or required (see
    // compat/classloadout). No separate thin "API" jar exists (unlike JourneyMap), so this is
    // the full mod jar; modCompileOnly (not plain compileOnly) so MDG remaps it like squadtp.
    modCompileOnly "uk.iwaservice:classloadout:${classloadout_version}"
    // Same jar again, for runClient/runServer only, so the integration is actually exercisable
    // in the dev environment without classloadout being a real project dependency.
    modRuntimeOnly "uk.iwaservice:classloadout:${classloadout_version}"
}

// mods.toml's version="${file.jarVersion}" reads this manifest attribute; without it Forge has
// nothing to substitute and the mods list falls back to a stale/default version display.
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

// Debug aid: print the resolved runtime classpath entries for squadtp.
tasks.register('printSquadtpCp') {
    def cp = configurations.runtimeClasspath
    doLast { cp.files.findAll { it.name.contains('squadtp') }.each { println it } }
}
