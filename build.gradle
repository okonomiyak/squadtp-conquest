plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }

        // Second client for two-player testing (separate game dir + username).
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // squadtp jar built by the sibling project; never modified from here.
    // Ivy artifact-only layout gives the jar real module metadata so MDG's
    // SRG->named remapping transform applies (flatDir/files() do not work).
    // squadtp's own build embeds the MC version/loader in its jar filename
    // (archivesName = "squadtp-${minecraft_version}-neoforge"), so the pattern
    // has to match that instead of a bare "[module]-[revision].[ext]".
    ivy {
        name = 'squadtpLocal'
        url = uri(file('../squadtp-1.21.1/build/libs'))
        patternLayout { artifact "[module]-${minecraft_version}-neoforge-[revision].[ext]" }
        metadataSources { artifact() }
        content { includeModule('uk.iwaservice', 'squadtp') }
    }
    // JourneyMap API v2 (new recommended host; the old jm.gserv.me host is kept as a
    // fallback below since JourneyMap still publishes there too, but is less reliable).
    maven {
        name = 'JourneyMapNew'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
    }
    // Full JourneyMap mod for in-dev runtime testing
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// JourneyMap API 2.0.x is still pre-1.0/actively iterating; re-check for updates every build
// instead of Gradle's default 24h cache, per the API's own setup instructions.
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    // squadtp jar (already named-mapped, no SRG remap needed under plain NeoForge).
    // NeoForge auto-discovers it as a mod on the runtime classpath in runClient/runServer.
    implementation "uk.iwaservice:squadtp:${squadtp_version}"

    // Compile-time only soft dependency: never shipped, never required at runtime.
    compileOnly group: 'info.journeymap', name: 'journeymap-api-neoforge', version: journeymap_api_version, changing: true

    // JourneyMap 1.21.1-6.0.2+neoforge, for the dev runtime only.
    // Production jars must NOT go into run/mods: this is a runtime-only test copy.
    runtimeOnly 'curse.maven:journeymap-32274:8523102'
    // Required at runtime when JourneyMap is added as a dependency jar rather than
    // dropped into run/mods directly (see the API's setup docs).
    runtimeOnly 'curse.maven:common-network-806044:7087488'

    // classloadout: soft dependency (see compat/ClassLoadoutCompat), stubbed out here.
    // ponytail: classloadout has no NeoForge/1.21.1 build yet; restore the ivy repo + modCompileOnly/
    // modRuntimeOnly dependency (see squadtp-conquest-1.20.1's build.gradle) once it's ported.
}

// mods.toml's version="${file.jarVersion}" reads this manifest attribute; without it NeoForge has
// nothing to substitute and the mods list falls back to a stale/default version display.
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

// Debug aid: print the resolved runtime classpath entries for squadtp.
tasks.register('printSquadtpCp') {
    def cp = configurations.runtimeClasspath
    doLast { cp.files.findAll { it.name.contains('squadtp') }.each { println it } }
}
